<!DOCTYPE html>
<html lang="hi" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HARI Global Market - Supreme Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --hari-green: #2ecc71; --hari-gold: #f1c40f; --hari-dark: #050a18; }
        body { background: var(--hari-dark); font-family: 'Inter', sans-serif; color: white; overflow-x: hidden; margin: 0; }
        
        /* Glassmorphism UI */
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 32px; transition: 0.4s; }
        .glass:hover { border-color: var(--hari-gold); box-shadow: 0 0 30px rgba(241, 196, 15, 0.1); }
        
        /* Buttons */
        .btn-gold { background: linear-gradient(135deg, #f1c40f, #f39c12); color: white; font-weight: 900; border-radius: 24px; cursor: pointer; transition: 0.3s; border: none; }
        .btn-white { background: #ffffff; color: #050a18; font-weight: 900; border-radius: 24px; cursor: pointer; }
        
        /* Animations */
        .app-window { background: #f8fafc; color: #1e293b; min-height: 100vh; width: 100%; position: fixed; top: 0; left: 0; z-index: 2000; overflow-y: auto; display: none; }
        .app-window.active { display: block; animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* Notification Toast */
        #notification { position: fixed; top: 20px; right: 20px; z-index: 3000; transform: translateX(200%); transition: 0.5s; }
        #notification.show { transform: translateX(0); }
    </style>
</head>
<body>

    <div id="notification" class="bg-white text-slate-900 p-4 rounded-3xl shadow-2xl border-l-8 border-yellow-500 flex items-center gap-4 max-w-sm">
        <span class="text-2xl">🔔</span>
        <div>
            <p id="notif-title" class="font-black text-xs uppercase">HAI AI Update</p>
            <p id="notif-msg" class="text-xs text-slate-500">System is fully optimized.</p>
        </div>
    </div>

    <nav class="p-6 flex justify-between items-center sticky top-0 z-[100] bg-[#050a18]/90 border-b border-white/5 backdrop-blur-xl">
        <div>
            <h1 class="text-2xl font-black tracking-tighter" onclick="location.reload()">
                <span class="text-white">HARI</span><span class="text-yellow-500">GLOBAL</span>
            </h1>
            <p class="text-[8px] font-black text-green-500 uppercase tracking-widest mt-1">HAI AI Mesh Active</p>
        </div>
        <div class="flex gap-4 items-center">
            <button onclick="openApp('Admin', '🔐')" class="text-[10px] bg-red-500/10 text-red-500 px-4 py-2 rounded-full font-black border border-red-500/20">ADMIN</button>
            <div onclick="openApp('Profile', '👤')" class="w-12 h-12 bg-gradient-to-tr from-yellow-500 to-green-500 rounded-2xl flex items-center justify-center font-black text-white shadow-xl cursor-pointer">H</div>
        </div>
    </nav>

    <marquee scrollamount="8" class="py-3 bg-white/5 border-b border-white/5 text-[11px] font-bold text-yellow-500 uppercase tracking-widest">
        ● HAI AI: ग्लोबल मार्केट सक्रिय ● रीयल-टाइम मेश नेटवर्क सिंक ● सुरक्षित भुगतान इंजन 2.0 चालू है ● $1.2M वॉलेट सुरक्षित ● 
    </marquee>

    <div id="home-view" class="container mx-auto px-5 py-8 pb-32">
        <div class="glass p-10 mb-10 relative overflow-hidden">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <p class="text-[10px] text-slate-400 font-black uppercase tracking-[5px] mb-2">My Balance</p>
                    <h2 class="text-6xl font-black text-white">$1,250,480.00</h2>
                </div>
                <button class="bg-white/10 p-4 rounded-3xl text-2xl">💼</button>
            </div>
            <div class="flex gap-4">
                <button class="btn-gold flex-1 py-5 text-sm" onclick="openApp('Payment', '💳')">DEPOSIT</button>
                <button class="btn-white flex-1 py-5 text-sm" onclick="openApp('Banking', '🏦')">WITHDRAW</button>
            </div>
        </div>

        <div class="relative mb-10">
            <input type="text" id="global-search" onkeyup="searchService()" placeholder="Search Market, Tenders, or Tools..." class="w-full bg-white/5 border border-white/10 p-6 rounded-[30px] outline-none focus:border-yellow-500 transition-all text-sm font-medium">
            <span class="absolute right-8 top-6 opacity-30 text-xl">🔍</span>
        </div>

        <h3 class="text-xs font-black mb-8 text-slate-500 uppercase tracking-[4px] flex items-center gap-3">
            <span class="w-10 h-[2px] bg-yellow-500"></span> Ecosystem Apps
        </h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6" id="service-grid"></div>
    </div>

    <div id="app-view" class="app-window">
        <div class="sticky top-0 bg-white/80 backdrop-blur-xl border-b p-6 flex justify-between items-center z-[2100]">
            <div class="flex items-center gap-5">
                <span id="app-icon" class="text-4xl"></span>
                <h2 id="app-name" class="text-2xl font-black text-slate-900 tracking-tighter uppercase">Service</h2>
            </div>
            <button onclick="closeApp()" class="bg-red-50 text-red-600 px-8 py-3 rounded-2xl font-black text-xs uppercase border border-red-100">Close</button>
        </div>
        <div id="app-content" class="p-8 container mx-auto pb-32"></div>
    </div>

    <script>
        const services = [
            {n: "Market", i: "🛒", f: "Premium Store", content: "Products"},
            {n: "Social", i: "📱", f: "HAI Chat Feed", content: "Messages"},
            {n: "Freelance", i: "💼", f: "Jobs & Bids", content: "Projects"},
            {n: "Banking", i: "🏦", f: "P2P Ledger", content: "Ledger"},
            {n: "Tenders", i: "🏛️", f: "Global Bidding", content: "Bids"},
            {n: "Software", i: "💻", f: "AI Dev Tools", content: "Cloud"},
            {n: "Education", i: "🎓", f: "HAI Academy", content: "Courses"},
            {n: "Travel", i: "🎫", f: "Private Fleet", content: "Tickets"},
            {n: "Settings", i: "⚙️", f: "System Config", content: "Setup"}
        ];

        function renderGrid() {
            const grid = document.getElementById('service-grid');
            grid.innerHTML = "";
            services.forEach(s => {
                grid.innerHTML += `
                    <div onclick="openApp('${s.n}', '${s.i}')" class="service-card glass p-8 text-center cursor-pointer active:scale-95 group">
                        <div class="text-5xl mb-6 group-hover:scale-110 transition-transform">${s.i}</div>
                        <div class="text-sm font-black uppercase text-white tracking-widest">${s.n}</div>
                        <div class="text-[9px] text-green-500 font-black mt-3 uppercase opacity-60">${s.f}</div>
                    </div>
                `;
            });
        }

        function openApp(name, icon) {
            document.body.style.overflow = 'hidden';
            const app = document.getElementById('app-view');
            app.classList.add('active');
            document.getElementById('app-name').innerText = "HARI " + name;
            document.getElementById('app-icon').innerText = icon;
            
            let html = "";
            if(name === 'Market') {
                html = `<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    ${[1,2,3,4].map(i => `<div class="bg-white p-6 rounded-[40px] border shadow-sm flex items-center gap-6">
                        <div class="w-24 h-24 bg-slate-50 rounded-3xl flex items-center justify-center text-4xl">📦</div>
                        <div class="flex-1 text-slate-900"><h4 class="font-black text-xl text-slate-900">Premium Item #${i}</h4><p class="text-green-600 font-black">$${(Math.random()*2000).toFixed(2)}</p></div>
                        <button class="btn-gold px-6 py-3 text-[10px]" onclick="showNotif('Order Placed', 'Item added to your fleet.')">BUY</button>
                    </div>`).join('')}
                </div>`;
            } else if(name === 'Social') {
                html = `<div class="max-w-2xl mx-auto flex flex-col h-[70vh]">
                    <div class="flex-1 space-y-6 overflow-y-auto mb-6">
                        <div class="bg-slate-100 p-6 rounded-[35px] rounded-tl-none font-medium text-sm">Hello Harigovind! I am HAI AI. All global nodes are synchronized. Your current market value has increased by 15.4% today.</div>
                        <div class="bg-yellow-500 text-white p-6 rounded-[35px] rounded-tr-none font-medium text-sm ml-auto">That's great, HAI. Confirm the settlement of Tenders.</div>
                    </div>
                    <div class="bg-white p-2 rounded-[30px] shadow-2xl flex border"><input type="text" placeholder="Type a command..." class="flex-1 px-6 outline-none font-bold text-slate-800"><button class="btn-gold w-14 h-14 text-xl">➤</button></div>
                </div>`;
            } else if(name === 'Admin') {
                html = `<div class="max-w-md mx-auto text-center py-20">
                    <div class="text-7xl mb-8">🔐</div><h3 class="text-3xl font-black mb-4">Admin Security</h3>
                    <input type="password" id="admin-key" placeholder="Enter Master Key" class="w-full p-6 bg-slate-100 rounded-[30px] border-none text-center text-2xl mb-6 outline-none">
                    <button onclick="verifyAdmin()" class="btn-gold w-full py-6 text-lg">ACCESS CONSOLE</button>
                </div>`;
            } else if(name === 'Banking') {
                html = `<div class="max-w-3xl mx-auto"><div class="bg-slate-900 p-10 rounded-[50px] text-white mb-10">
                    <p class="text-[10px] font-black uppercase tracking-[5px] opacity-40 mb-2">Secure P2P Wallet</p>
                    <h2 class="text-5xl font-black">$1,250,480.00</h2>
                </div>
                <div class="bg-white rounded-[40px] border overflow-hidden">
                    <div class="p-6 border-b font-black uppercase text-xs">Recent Ledger</div>
                    ${[1,2,3,4,5].map(i => `<div class="p-6 border-b flex justify-between items-center"><div><p class="font-black text-slate-800">Global Node Credit #${i}</p><p class="text-[10px] text-slate-400 font-bold">JAN 26, 2026</p></div><b class="text-green-600 font-black">+$5,200.00</b></div>`).join('')}
                </div></div>`;
            } else if(name === 'Profile') {
                html = `<div class="max-w-xl mx-auto text-center">
                    <div class="w-40 h-40 bg-gradient-to-tr from-yellow-500 to-green-500 rounded-[50px] flex items-center justify-center font-black text-white text-6xl mx-auto mb-8 shadow-2xl">H</div>
                    <h3 class="text-4xl font-black text-slate-900">Harigovind</h3>
                    <p class="text-slate-400 font-black uppercase tracking-[5px] mt-2 mb-10">Chief Ecosystem Owner</p>
                    <div class="grid grid-cols-2 gap-6"><div class="bg-slate-50 p-8 rounded-[40px]"><h4 class="text-3xl font-black">1.8M</h4><p class="text-[10px] text-slate-400 font-black uppercase mt-2">Active Users</p></div><div class="bg-slate-50 p-8 rounded-[40px]"><h4 class="text-3xl font-black">Top 1%</h4><p class="text-[10px] text-slate-400 font-black uppercase mt-2">Global Standing</p></div></div>
                </div>`;
            } else {
                html = `<div class="text-center py-20 text-slate-300"><div class="text-9xl mb-10">${icon}</div><h3 class="text-4xl font-black text-slate-900">${name} Hub</h3><p class="mt-4 font-black text-xs uppercase tracking-[5px]">Synchronizing Data Modules...</p></div>`;
            }

            document.getElementById('app-content').innerHTML = html;
            speakAI(`${name} module activated.`);
        }

        function verifyAdmin() {
            if(document.getElementById('admin-key').value === 'HAI-2026-SUPREME') {
                showNotif('Access Granted', 'Welcome to Master Console.');
                document.getElementById('app-content').innerHTML = `<div class="p-10 bg-red-50 rounded-[40px] border border-red-100 text-red-600 font-black text-center text-2xl uppercase tracking-widest">⚠️ Master Control Panel Active ⚠️</div>`;
            } else {
                showNotif('Access Denied', 'Invalid Master Security Key.');
            }
        }

        function showNotif(title, msg) {
            const n = document.getElementById('notification');
            document.getElementById('notif-title').innerText = title;
            document.getElementById('notif-msg').innerText = msg;
            n.classList.add('show');
            setTimeout(() => n.classList.remove('show'), 4000);
        }

        function searchService() {
            let input = document.getElementById('global-search').value.toUpperCase();
            let cards = document.getElementsByClassName('service-card');
            for (let i = 0; i < cards.length; i++) {
                let name = cards[i].innerText.toUpperCase();
                cards[i].style.display = name.indexOf(input) > -1 ? "" : "none";
            }
        }

        function closeApp() { 
            document.getElementById('app-view').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function speakAI(text) {
            const msg = new SpeechSynthesisUtterance(text);
            msg.rate = 1.1;
            window.speechSynthesis.speak(msg);
        }

        renderGrid();
        setTimeout(() => showNotif('System Ready', 'Welcome back, Hari! All systems are nominal.'), 2000);
    </script>
</body>
    </html>
