<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HARI GLOBAL STUDIO - HAI AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --hari-green: #2ecc71; --hari-gold: #f1c40f; }
        body { background-color: #ffffff; font-family: 'Segoe UI', sans-serif; }
        .golden-btn { 
            background: linear-gradient(45deg, #f1c40f, #f39c12);
            color: white; font-weight: bold; border-radius: 50px;
            transition: 0.3s; box-shadow: 0 4px 15px rgba(241, 196, 15, 0.4);
        }
        .golden-btn:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(241, 196, 15, 0.6); }
        .green-border { border-left: 5px solid var(--hari-green); }
        .icon-box { font-size: 2.5rem; color: var(--hari-green); }
    </style>
</head>
<body>

    <nav class="p-6 shadow-md flex justify-between items-center bg-white sticky top-0 z-50">
        <h1 class="text-3xl font-black text-green-600 tracking-tighter">HARI <span class="text-yellow-500">GLOBAL</span> STUDIO</h1>
        <div>
            <button onclick="showModal('login')" class="golden-btn px-6 py-2 mr-2">लॉगिन</button>
            <button onclick="showModal('signup')" class="bg-green-600 text-white px-6 py-2 rounded-full font-bold">साइनअप</button>
        </div>
    </nav>

    <header class="text-center py-20 bg-gray-50">
        <h2 class="text-5xl font-bold text-gray-800">दुनिया को <span class="text-green-600">स्वर्ग</span> बनाने का मिशन</h2>
        <p class="mt-4 text-xl text-gray-600">HAI (Hari AI) द्वारा संचालित 12 महा-व्यवसाय</p>
    </header>

    <section class="container mx-auto px-6 py-12">
        <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-8">
            <script>
                const businesses = [
                    {n: "सोशल मीडिया", i: "📱", d: "Recharge Model"},
                    {n: "फ्रीलांसिंग", i: "💼", d: "Commission Model"},
                    {n: "डेटिंग/चैट", i: "💖", d: "Coins Recharge"},
                    {n: "डिज़ाइन स्टूडियो", i: "🎨", d: "Subscription"},
                    {n: "सॉफ्टवेयर देव", i: "💻", d: "Project Model"},
                    {n: "ऑफिस ERP/CRM", i: "📊", d: "SaaS Model"},
                    {n: "बैंकिंग कोर", i: "🏦", d: "Safe Vault"},
                    {n: "ई-कॉमर्स", i: "🛒", d: "Multi-Vendor"},
                    {n: "शिक्षा (Edu)", i: "🎓", d: "Free & Premium"},
                    {n: "पेमेंट गेटवे", i: "💳", d: "Global Access"},
                    {n: "टिकट बुकिंग", i: "🎫", d: "Instant Booking"},
                    {n: "B2B टेंडर्स", i: "🏛️", d: "Govt Contracts"}
                ];
                businesses.forEach(b => {
                    document.write(`
                        <div class="p-8 bg-white shadow-xl rounded-2xl green-border hover:shadow-2xl transition cursor-pointer text-center">
                            <div class="icon-box mb-4">${b.i}</div>
                            <h3 class="text-xl font-bold text-gray-800">${b.n}</h3>
                            <p class="text-gray-500 text-sm mb-4">${b.d}</p>
                            <button class="golden-btn w-full py-2">खोलें</button>
                        </div>
                    `);
                });
            </script>
        </div>
    </section>

    <div id="modal-overlay" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-[100]">
        <div class="bg-white p-10 rounded-3xl w-full max-w-md shadow-2xl relative">
            <h2 id="modal-title" class="text-3xl font-bold text-green-600 mb-6">साइनअप</h2>
            
            <input type="text" placeholder="मोबाइल / ईमेल" class="w-full p-4 border rounded-xl mb-4 outline-green-500">
            <button class="w-full bg-green-600 text-white py-4 rounded-xl font-bold mb-4">OTP प्राप्त करें</button>
            
            <div class="flex gap-2 mb-4">
                <input type="text" maxlength="1" class="w-1/4 p-4 border text-center text-2xl font-bold rounded-xl outline-green-500">
                <input type="text" maxlength="1" class="w-1/4 p-4 border text-center text-2xl font-bold rounded-xl outline-green-500">
                <input type="text" maxlength="1" class="w-1/4 p-4 border text-center text-2xl font-bold rounded-xl outline-green-500">
                <input type="text" maxlength="1" class="w-1/4 p-4 border text-center text-2xl font-bold rounded-xl outline-green-500">
            </div>

            <button onclick="window.location.href='#dashboard'" class="golden-btn w-full py-4 text-lg">वेरिफाई और लॉगिन</button>
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 text-2xl">×</button>
        </div>
    </div>

    <script>
        function showModal(type) {
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('modal-title').innerText = type === 'login' ? 'लॉगिन' : 'नया अकाउंट';
        }
        function closeModal() { document.getElementById('modal-overlay').classList.add('hidden'); }
    </script>

</body>
                    </html>
