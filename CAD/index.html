<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAI ULTIMATE MASTER STUDIO</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #000; color: #fff; margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(15, 15, 15, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .neon-border { border: 1px solid #00f3ff; box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); }
        .hide-scroll::-webkit-scrollbar { display: none; }
        canvas { width: 100% !important; height: 100% !important; border-radius: 20px; }
    </style>
</head>
<body>
    <div id="hai-root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function HAIMasterStudio() {
            const [activeTool, setActiveTool] = useState('CAD');
            const [activeSector, setActiveSector] = useState("Automobile");
            const [isProcessing, setIsProcessing] = useState(false);
            const [selectedImage, setSelectedImage] = useState(null);
            const mountRef = useRef(null);

            const sectors = ["Automobile", "Infrastructure", "Agriculture", "Fashion", "Aerospace", "Medical Lab"];

            // 1. 3D Engine Logic
            useEffect(() => {
                if (activeTool === 'CAD' && mountRef.current) {
                    const scene = new THREE.Scene();
                    const camera = new THREE.PerspectiveCamera(75, mountRef.current.clientWidth / mountRef.current.clientHeight, 0.1, 1000);
                    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                    renderer.setSize(mountRef.current.clientWidth, mountRef.current.clientHeight);
                    mountRef.current.innerHTML = ''; 
                    mountRef.current.appendChild(renderer.domElement);

                    const grid = new THREE.GridHelper(50, 50, 0x00f3ff, 0x111111);
                    scene.add(grid);
                    
                    const geometry = new THREE.IcosahedronGeometry(2, 2);
                    const material = new THREE.MeshStandardMaterial({ color: 0x00f3ff, wireframe: true });
                    const object = new THREE.Mesh(geometry, material);
                    scene.add(object);

                    const light = new THREE.PointLight(0xffffff, 1, 100);
                    light.position.set(10, 10, 10);
                    scene.add(light);
                    scene.add(new THREE.AmbientLight(0x404040));

                    camera.position.z = 8;

                    const animate = () => {
                        requestAnimationFrame(animate);
                        object.rotation.y += 0.005;
                        renderer.render(scene, camera);
                    };
                    animate();
                }
            }, [activeTool]);

            // 2. Converters Logic
            const handleAction = (msg) => {
                alert(`HAI AI: ${msg}`);
            };

            return (
                <div className="h-screen flex flex-col overflow-hidden">
                    {/* --- HEADER --- */}
                    <div className="h-20 glass flex items-center justify-between px-8 border-b border-zinc-800">
                        <div>
                            <h1 className="text-2xl font-black text-cyan-400 tracking-tighter uppercase">HAI UNIVERSAL ENGINE</h1>
                            <p className="text-[9px] text-zinc-500 font-bold uppercase tracking-widest">Global Industrial & Glamour Suite</p>
                        </div>

                        <div className="flex gap-4">
                            <button onClick={()=>setActiveTool('CAD')} className={`px-4 py-2 rounded-xl text-xs font-bold transition ${activeTool === 'CAD' ? 'bg-cyan-500 text-black' : 'bg-zinc-800'}`}>🏗️ CAD ENGINE</button>
                            <button onClick={()=>setActiveTool('GLAMOUR')} className={`px-4 py-2 rounded-xl text-xs font-bold transition ${activeTool === 'GLAMOUR' ? 'bg-pink-600 text-white' : 'bg-zinc-800'}`}>👗 GLAMOUR PRO</button>
                        </div>
                    </div>

                    <div className="flex flex-1 overflow-hidden">
                        {/* --- LEFT PANEL: CONTROLS & AI --- */}
                        <div className="w-[350px] border-r border-zinc-800 bg-[#080808] p-6 flex flex-col gap-6 overflow-y-auto">
                            
                            {/* Sector Selector */}
                            <div>
                                <label className="text-[10px] text-zinc-500 font-bold uppercase mb-2 block">Active Sector</label>
                                <div className="grid grid-cols-2 gap-2">
                                    {sectors.map(s => (
                                        <button key={s} onClick={()=>setActiveSector(s)} className={`text-[10px] p-2 rounded-lg border border-zinc-800 ${activeSector === s ? 'border-cyan-500 text-cyan-500' : 'text-zinc-500'}`}>{s}</button>
                                    ))}
                                </div>
                            </div>

                            <hr className="border-zinc-800" />

                            {/* Global Tools */}
                            <div className="space-y-4">
                                <label className="text-[10px] text-zinc-500 font-bold uppercase block">Universal Converters</label>
                                <div className="flex flex-wrap gap-2">
                                    <button onClick={()=>handleAction("Converting to PDF...")} className="p-2 bg-zinc-900 rounded-lg text-xs hover:bg-zinc-700">📄 PDF</button>
                                    <button onClick={()=>handleAction("Exporting Excel...")} className="p-2 bg-zinc-900 rounded-lg text-xs hover:bg-zinc-700">📊 EXCEL</button>
                                    <button onClick={()=>handleAction("Converting Image...")} className="p-2 bg-zinc-900 rounded-lg text-xs hover:bg-zinc-700">🖼️ JPG/PNG</button>
                                    <button onClick={()=>handleAction("Resizing File...")} className="p-2 bg-zinc-900 rounded-lg text-xs hover:bg-zinc-700">✂️ RESIZE</button>
                                </div>
                            </div>

                            {/* File Upload Area */}
                            <div className="mt-auto border-2 border-dashed border-zinc-800 rounded-3xl p-6 text-center hover:border-cyan-500 transition cursor-pointer">
                                <i className="fas fa-cloud-upload-alt text-2xl text-zinc-600 mb-2"></i>
                                <p className="text-[10px] font-bold text-zinc-400">UPLOAD BLUEPRINT / PHOTO</p>
                                <p className="text-[8px] text-zinc-600 uppercase mt-1">AI Will Analyze Automatically</p>
                            </div>
                        </div>

                        {/* --- RIGHT PANEL: THE PREVIEW --- */}
                        <div className="flex-1 bg-[#030303] relative p-8">
                            <div className="absolute top-8 left-8 z-10">
                                <span className="text-xs font-black text-cyan-500 uppercase tracking-widest bg-black/50 px-3 py-1 rounded-full border border-cyan-500/30">System: {activeTool} // {activeSector}</span>
                            </div>

                            {activeTool === 'CAD' ? (
                                <div ref={mountRef} className="w-full h-full rounded-[40px] overflow-hidden neon-border"></div>
                            ) : (
                                <div className="w-full h-full flex flex-col items-center justify-center border border-pink-500/20 rounded-[40px] bg-gradient-to-b from-zinc-900/20 to-black">
                                    <div className="text-center">
                                        <i className="fas fa-user-astronaut text-6xl text-pink-500 mb-4 opacity-20"></i>
                                        <p className="text-zinc-500 text-sm font-light tracking-[0.5em]">WAITING FOR GLAMOUR INPUT</p>
                                        <button className="mt-6 bg-pink-600 px-8 py-3 rounded-full text-[10px] font-black uppercase tracking-widest hover:shadow-[0_0_20px_rgba(219,39,119,0.5)]">Activate Virtual Model</button>
                                    </div>
                                </div>
                            )}

                            {/* Bottom Master Bar */}
                            <div className="absolute bottom-12 left-1/2 -translate-x-1/2 flex gap-4 bg-black/80 p-3 rounded-3xl border border-zinc-800 backdrop-blur-xl">
                                <button onClick={()=>handleAction("Printing...")} className="p-4 bg-zinc-900 rounded-2xl hover:text-cyan-400 transition"><i className="fas fa-print"></i></button>
                                <button onClick={()=>handleAction("Starting Video Render...")} className="p-4 bg-zinc-900 rounded-2xl hover:text-pink-400 transition"><i className="fas fa-video"></i></button>
                                <button onClick={()=>handleAction("Downloading Bundle...")} className="p-4 bg-cyan-600 text-black rounded-2xl font-black px-8">EXECUTE DOWNLOAD</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('hai-root'));
        root.render(<HAIMasterStudio />);
    </script>
</body>
</html>
