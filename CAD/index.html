<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAI WORLD CAD | Global Engine</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #020202; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .active-btn { background: #00f3ff; color: #000; box-shadow: 0 0 20px rgba(0, 243, 255, 0.4); border: none; font-weight: 800; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        canvas { border-radius: 2rem; }
        .loading-pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>
    <div id="hai-root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 1. सभी 20 क्षेत्रों की फाइल मैपिंग
        const CAD_MODULES = {
            "Aerospace": "sectors/aerospace.js", "Automobile": "sectors/auto.js",
            "Architecture": "sectors/arch.js", "Electrical": "MathEngine.js Library.js ConnectionLogic.js AIGenerator.js Simulator.js MasterDesigner.jsx ExportModule.js VisualSymbols.js UserDashboard.jsx MasterGuard.js",
            "Electronics": "sectors/pcb.js", "Civil": "sectors/civil.js",
            "Mechanical": "sectors/mech.js", "Fashion": "sectors/fashion.js",
            "Medical": "sectors/medical.js", "Shipbuilding": "sectors/ship.js",
            "Landscape": "sectors/land.js", "Interior": "sectors/interior.js",
            "Product": "sectors/prod.js", "Jewelry": "sectors/jewel.js",
            "Dental": "sectors/dental.js", "Plant": "sectors/plant.js",
            "Structural": "sectors/struct.js", "HVAC": "sectors/hvac.js",
            "Piping": "sectors/piping.js", "Manufacturing": "sectors/cim.js"
        };

        function HAIWorldCAD() {
            const [selectedSector, setSelectedSector] = useState("Mechanical");
            const [loading, setLoading] = useState(false);
            const mountRef = useRef(null);

            // 2. सेक्टर फाइल लोडर (Dynamic Script Injection)
            useEffect(() => {
                setLoading(true);
                const filePath = CAD_MODULES[selectedSector];
                
                // पुरानी स्क्रिप्ट हटाकर नई जोड़ना
                const oldScript = document.getElementById('sector-logic');
                if (oldScript) oldScript.remove();

                const script = document.createElement('script');
                script.id = 'sector-logic';
                script.src = filePath;
                script.onload = () => {
                    setLoading(false);
                    if(window.HAI_LOAD_TOOLS) window.HAI_LOAD_TOOLS(selectedSector);
                };
                script.onerror = () => {
                    console.error("File not found: " + filePath);
                    setLoading(false);
                };
                document.body.appendChild(script);

                // 3D Scene (Simplified)
                const width = mountRef.current.clientWidth, height = mountRef.current.clientHeight;
                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(75, width/height, 0.1, 1000);
                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(width, height);
                mountRef.current.innerHTML = '';
                mountRef.current.appendChild(renderer.domElement);
                
                const mesh = new THREE.Mesh(
                    new THREE.TorusKnotGeometry(3, 0.8, 100, 16),
                    new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: true })
                );
                scene.add(mesh);
                camera.position.z = 10;
                
                const animate = () => {
                    requestAnimationFrame(animate);
                    mesh.rotation.y += 0.01;
                    renderer.render(scene, camera);
                };
                animate();
            }, [selectedSector]);

            return (
                <div className="flex h-screen p-4 gap-4 bg-[#010101]">
                    {/* बायाँ पैनल: सेक्टर लिस्ट */}
                    <aside className="w-80 glass rounded-[2.5rem] p-6 flex flex-col overflow-hidden">
                        <div className="flex items-center gap-3 mb-8 border-b border-white/5 pb-4">
                            <div className="w-10 h-10 bg-cyan-500 rounded-xl flex items-center justify-center text-black font-black text-xl shadow-[0_0_15px_rgba(0,243,255,0.5)]">H</div>
                            <div>
                                <h2 className="text-sm font-black tracking-tighter uppercase">HAI WORLD</h2>
                                <p className="text-[9px] text-cyan-500 font-bold tracking-[3px]">CAD ENGINE</p>
                            </div>
                        </div>
                        <div className="overflow-y-auto no-scrollbar grid-container">
                            {Object.keys(CAD_MODULES).map(s => (
                                <button 
                                    key={s} 
                                    onClick={() => setSelectedSector(s)}
                                    className={`p-3 rounded-xl text-[10px] font-bold uppercase transition-all border ${selectedSector === s ? 'active-btn' : 'border-white/5 text-zinc-500 hover:text-white hover:bg-white/5'}`}
                                >
                                    {s}
                                </button>
                            ))}
                        </div>
                    </aside>

                    {/* मुख्य पैनल: इंजन व्यू */}
                    <main className="flex-1 flex flex-col gap-4">
                        <header className="h-20 glass rounded-[2.5rem] flex items-center justify-between px-10 border-l-4 border-cyan-500">
                            <div>
                                <h1 className={`text-[10px] font-black uppercase tracking-[4px] ${loading ? 'text-yellow-500 loading-pulse' : 'text-cyan-500'}`}>
                                    {loading ? 'SYNCING MODULE...' : 'SYSTEM ACTIVE'}
                                </h1>
                                <p className="text-2xl font-black uppercase italic">{selectedSector} Engine</p>
                            </div>
                            <div className="text-right">
                                <p className="text-[10px] text-zinc-500 font-mono">LINKED_FILE:</p>
                                <p className="text-xs text-white font-mono bg-white/5 px-3 py-1 rounded-md">{CAD_MODULES[selectedSector]}</p>
                            </div>
                        </header>

                        <div ref={mountRef} className="flex-1 glass rounded-[3rem] border border-cyan-500/10 relative overflow-hidden">
                            {loading && (
                                <div className="absolute inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center">
                                    <div className="text-cyan-500 font-black tracking-widest animate-pulse uppercase text-sm">Loading Sector Logic...</div>
                                </div>
                            )}
                            <div className="absolute top-8 left-8 p-4 glass rounded-2xl border border-white/10">
                                <p className="text-[10px] text-cyan-400 font-bold mb-1 underline">CORE DATA</p>
                                <p className="text-[9px] text-zinc-400">FPS: 60.0</p>
                                <p className="text-[9px] text-zinc-400">LATENCY: 0.02ms</p>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('hai-root'));
        root.render(<HAIWorldCAD />);
    </script>
</body>
</html>
