<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>HAI Global HUB - Multi-Vendor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .golden-tag { background: linear-gradient(90deg, #f1c40f, #f39c12); color: white; }
        .vendor-card:hover { border-color: #2ecc71; transform: translateY(-5px); }
        .commission-badge { position: absolute; top: 10px; right: 10px; background: rgba(46, 204, 113, 0.9); color: white; padding: 2px 10px; border-radius: 10px; font-size: 0.7rem; }
    </style>
</head>
<body class="bg-white">

    <nav class="p-4 border-b-2 border-green-500 flex justify-between items-center px-10">
        <h1 class="text-2xl font-bold text-green-600">HARI <span class="text-yellow-500">MARKET</span></h1>
        <div class="flex gap-4">
            <button class="bg-green-100 text-green-700 px-4 py-2 rounded-lg font-bold">वेंडर बनें</button>
            <button class="golden-tag px-6 py-2 rounded-lg font-bold">मेरी टोकरी (0)</button>
        </div>
    </nav>

    <div class="container mx-auto p-10">
        <h2 class="text-3xl font-bold mb-8 border-l-8 border-green-500 pl-4">दुनिया के बेहतरीन प्रोडक्ट्स</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
            <script>
                const products = [
                    {n: "स्मार्टफोन V99", p: "$999", v: "Hai Electronics"},
                    {n: "गोल्डन वॉच", p: "$450", v: "Royal Traders"},
                    {n: "AI लैपटॉप", p: "$1200", v: "HAI Tech"},
                    {n: "स्वर्गीय कपड़े", p: "$80", v: "Heaven Fashion"}
                ];
                products.forEach(item => {
                    document.write(`
                        <div class="relative vendor-card border-2 p-6 rounded-3xl transition duration-300">
                            <span class="commission-badge">HAI Verified</span>
                            <div class="h-40 bg-gray-100 rounded-2xl mb-4 flex items-center justify-center text-4xl">📦</div>
                            <h3 class="text-xl font-bold">${item.n}</h3>
                            <p class="text-gray-500 text-sm">विक्रेता: ${item.v}</p>
                            <div class="flex justify-between items-center mt-4">
                                <span class="text-2xl font-black text-green-600">${item.p}</span>
                                <button class="golden-tag px-4 py-2 rounded-xl text-sm font-bold">अभी खरीदें</button>
                            </div>
                        </div>
                    `);
                });
            </script>
        </div>
    </div>
</body>
</html>
