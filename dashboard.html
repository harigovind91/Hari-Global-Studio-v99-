<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAI Dashboard - My Heaven</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Poppins', sans-serif; }
        .sidebar { background: #ffffff; border-right: 2px solid #e2e8f0; }
        .golden-card { 
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            color: white; box-shadow: 0 10px 20px rgba(243, 156, 18, 0.3);
        }
        .green-status { color: #27ae60; background: #e8f8f0; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; }
        .nav-link:hover { background: #f0fff4; color: #22c55e; border-left: 4px solid #22c55e; }
        .input-focus:focus { border-color: #22c55e; ring: 2px #22c55e; outline: none; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="sidebar w-64 hidden lg:flex flex-col">
        <div class="p-6 text-2xl font-bold text-green-600 border-bottom">
            HAI <span class="text-yellow-500">STUDIO</span>
        </div>
        <nav class="flex-1 px-4 mt-4 space-y-2">
            <a href="#" class="nav-link flex items-center p-3 rounded-xl transition font-medium"><i class="fa fa-home mr-3"></i> मुख्य डैशबोर्ड</a>
            <a href="#" class="nav-link flex items-center p-3 rounded-xl transition font-medium text-gray-600"><i class="fa fa-wallet mr-3"></i> मेरा वॉलेट (Coins)</a>
            <a href="#" class="nav-link flex items-center p-3 rounded-xl transition font-medium text-gray-600"><i class="fa fa-briefcase mr-3"></i> फ्रीलांस काम</a>
            <a href="#" class="nav-link flex items-center p-3 rounded-xl transition font-medium text-gray-600"><i class="fa fa-gear mr-3"></i> प्रोफाइल सेटिंग्स</a>
            <a href="index.html" class="flex items-center p-3 mt-10 text-red-500 font-bold"><i class="fa fa-sign-out mr-3"></i> लॉगआउट</a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-y-auto">
        
        <header class="bg-white p-6 shadow-sm flex justify-between items-center px-10">
            <h2 class="text-2xl font-bold text-gray-800">स्वागत है, <span class="text-green-600">हरिगोविंद जी</span></h2>
            <div class="flex items-center gap-4">
                <div class="text-right hidden sm:block">
                    <p class="text-sm font-bold">VIP मेम्बर</p>
                    <span class="green-status">Verified Account</span>
                </div>
                <img src="https://via.placeholder.com/50" class="w-12 h-12 rounded-full border-2 border-green-500">
            </div>
        </header>

        <div class="p-10 space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="golden-card p-8 rounded-3xl">
                    <p class="text-lg opacity-90">कुल बैलेंस (Global Wallet)</p>
                    <h3 class="text-4xl font-black mt-2">$24,500.00</h3>
                    <button class="mt-4 bg-white text-yellow-600 px-4 py-1 rounded-lg text-sm font-bold">विड्रॉल करें</button>
                </div>
                <div class="bg-white p-8 rounded-3xl shadow-lg border-b-4 border-green-500">
                    <p class="text-gray-500">डेटिंग/गेमिंग कॉइन्स</p>
                    <h3 class="text-4xl font-black mt-2 text-green-600">5,800 <small class="text-sm">🪙</small></h3>
                    <button class="mt-4 border border-green-500 text-green-600 px-4 py-1 rounded-lg text-sm font-bold">रिचार्ज</button>
                </div>
                <div class="bg-white p-8 rounded-3xl shadow-lg border-b-4 border-yellow-500">
                    <p class="text-gray-500">सक्रिय प्रोजेक्ट्स</p>
                    <h3 class="text-4xl font-black mt-2 text-gray-800">12</h3>
                    <p class="text-xs text-yellow-600 mt-2 font-bold">कमीशन मॉडल एक्टिव</p>
                </div>
            </div>

            <div class="bg-white p-10 rounded-3xl shadow-xl">
                <h3 class="text-2xl font-bold text-gray-800 mb-8 flex items-center">
                    <i class="fa fa-user-gear mr-3 text-green-600"></i> प्रोफाइल और पासवर्ड सेटअप
                </h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="space-y-4">
                        <label class="block font-bold text-gray-600">पूरा नाम</label>
                        <input type="text" value="Harigovind Singh Chauhan" class="w-full p-4 bg-gray-50 border rounded-2xl input-focus">
                    </div>
                    <div class="space-y-4">
                        <label class="block font-bold text-gray-600">ईमेल एड्रेस</label>
                        <input type="email" value="admin@haristudio.v99" class="w-full p-4 bg-gray-50 border rounded-2xl input-focus">
                    </div>
                    <div class="space-y-4">
                        <label class="block font-bold text-gray-600">नया पासवर्ड सेट करें</label>
                        <input type="password" placeholder="********" class="w-full p-4 bg-gray-50 border rounded-2xl input-focus">
                    </div>
                    <div class="space-y-4">
                        <label class="block font-bold text-gray-600">मोबाइल (Verified)</label>
                        <input type="text" value="+91 XXXXXXXX91" disabled class="w-full p-4 bg-gray-200 border rounded-2xl">
                    </div>
                </div>

                <div class="mt-10 flex gap-4">
                    <button class="bg-green-600 text-white px-10 py-4 rounded-2xl font-bold hover:bg-green-700 transition">प्रोफाइल अपडेट करें</button>
                    <button class="bg-gray-100 text-gray-600 px-10 py-4 rounded-2xl font-bold">कैंसिल</button>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
