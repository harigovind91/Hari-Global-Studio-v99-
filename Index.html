<div id="cad-workspace">
    <div id="three-container" style="width: 100%; height: 500px; background: #000;"></div>

    <div id="editor-ui" class="p-4 bg-zinc-900 border-t border-cyan-500/30">
        <h4 class="text-cyan-400 text-xs mb-2 uppercase">HAI CAD Engine - Active</h4>
        
        <div class="flex gap-4 items-center">
            <video id="main-preview" controls style="width:200px; border-radius:10px;"></video>
            <input type="file" id="upload-video" accept="video/*" class="text-[10px]">
            
            <div class="controls">
                <button onclick="applyAIFilter()" class="bg-cyan-600 px-4 py-2 rounded-lg text-xs font-bold">
                    Apply HAI AI Filter (Refine Design)
                </button>
                <button onclick="exportToSTL()" class="bg-zinc-800 ml-2 px-4 py-2 rounded-lg text-xs">
                    Export 3D (.STL)
                </button>
            </div>
        </div>
    </div>
</div>
